# =============================================================
# prometheus.yml  —  Prometheus(메트릭 수집·판단기)의 설정서
# 범례: [내가 정함] [기본값] [관례] [고정]
# =============================================================

global:
  scrape_interval: 15s      # [내가 정함] 15초마다 긁어옴. 값은 내가 정했지만
                            #            항목 자체는 안 쓰면 기본 1분이 적용됨.
  evaluation_interval: 15s  # [내가 정함] 알림 규칙을 15초마다 평가.

# 알림 규칙 파일의 위치를 알려줌
rule_files:
  - /etc/prometheus/alert.rules.yml   # [내가 정함] 이 경로에 규칙 파일이 있다고 지정.
                                      #   경로는 docker-compose에서 마운트한 위치와 일치해야 함.

# 경고(Firing)를 어디로 보낼지 = Alertmanager 주소
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]  # [내가 정함] 'alertmanager'는 compose 서비스 이름.
                                          #   9093은 [관례] Alertmanager 기본 포트.

# 무엇을 긁어올지 목록
scrape_configs:
  - job_name: "prometheus"      # [내가 정함] 별명(라벨). 아무 이름이나 가능.
    static_configs:
      - targets: ["localhost:9090"]  # [관례] Prometheus가 자기 자신을 감시하는 관습.
                                     #   경로(/metrics)는 [기본값]이라 생략됨.

  - job_name: "lab-app"         # [내가 정함] 내 앱에 붙인 별명.
    static_configs:
      - targets: ["app:8000"]   # [내가 정함] 'app'은 compose 서비스 이름, 8000은 내 앱 포트.
                                #   ★ 여기엔 metrics_path가 없음 → [기본값] '/metrics'를 자동으로 붙여
                                #     실제로는 http://app:8000/metrics 를 긁어옴.
                                #   경로를 바꾸려면 이 아래에 metrics_path: "/원하는경로" 추가.
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
      
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]